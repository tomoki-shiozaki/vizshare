name: Build and Push Staging Image

on:
  push:
    branches:
      - develop

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      # リポジトリ取得
      - name: Checkout
        uses: actions/checkout@v4

      # GHCR ログイン
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      # Docker build
      - name: Build Docker image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/vizshare-staging:${{ github.sha }} \
            -f backend/docker/Dockerfile.prod \
            backend

      # GHCR push
      - name: Push Docker image
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/vizshare-staging:${{ github.sha }}
