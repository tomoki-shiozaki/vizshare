name: Cleanup Staging Expired Datasets

on:
  schedule:
    - cron: "0 3 * * 0"

  workflow_dispatch:

concurrency:
  group: cleanup-staging
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest

    env:
      SECRET_KEY: ${{ secrets.SECRET_KEY_DEVELOP }}
      DATABASE_URL: ${{ secrets.DATABASE_URL_DEVELOP }}
      DEBUG: "False"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: backend/requirements/prod.txt

      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements/prod.txt

      - name: Run cleanup command
        run: |
          cd backend
          python manage.py delete_expired_datasets
